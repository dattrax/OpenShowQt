[package]
name = "pptx-render"
version = "0.1.0"
edition = "2021"
publish = false
description = "Render a PPTX deck to one PNG per visible slide for OpenShowQt"

[dependencies]
betteroffice-pptx = { path = "../../third_party/betteroffice/crates/betteroffice-pptx", default-features = false, features = ["raster", "fonts", "fonts-latin"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
